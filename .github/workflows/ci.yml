name: CI

# Every push to `main`, and every pull request. The job below runs
# `./build-and-test.sh`, which is the same script a developer runs — so a green
# tick here means exactly what a green run means locally.
on:
  push:
    branches: [main]
  pull_request:
  # By hand, so a rotated token or a changed runner can be checked without a
  # fake commit.
  workflow_dispatch:

# Read the checkout and nothing else: nothing here pushes, the sibling fetch
# below carries its own token, and the screenshot upload uses the runner's.
permissions:
  contents: read

# A second push does not pay for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Simulator (format, lint, test)
    runs-on: ubuntu-latest

    env:
      # SDL has no display on a runner. The tests set this for themselves, but
      # setting it job-wide means a new test that opens a window cannot fail
      # here for a reason that has nothing to do with what it is testing.
      SDL_VIDEODRIVER: dummy

    steps:
      - uses: actions/checkout@v6

      # The organisation's repositories are private, and a workflow's built-in
      # GITHUB_TOKEN reaches only the repository it runs in. Cargo fetches the
      # siblings over HTTPS, so the fetch is rewritten to carry a token that
      # can read them. Without this the failure is a 404 that reads like a typo.
      - name: Reach the organisation's private repositories
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.XPUI_CI_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      # The simulator links SDL2, so the workspace does not build without it.
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      # `rust-toolchain.toml` pins the channel and the components, so rustup
      # installs exactly that on the first cargo call. No bare-metal target:
      # nothing in this repository builds for a device.
      - name: Install Rust
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # ---- the gate --------------------------------------------------------
      #
      # One step, running the same script a developer runs, because two lists
      # of checks drift. Anything CI needs that a laptop does not is setup,
      # above; anything that decides whether the code is good is in the script,
      # where it can be run before pushing.
      - name: Gate
        run: ./build-and-test.sh check

      # A failed screenshot writes expected | actual | differences side by side,
      # so a failure here can be looked at rather than guessed at.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            target/diff/
            target/screenshots/
          if-no-files-found: ignore
