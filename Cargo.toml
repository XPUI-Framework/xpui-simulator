[package]
name = "xpui-simulator"
description = "Runs an xpui app in a desktop window, for developing screens without hardware"
readme = "README.md"
keywords = ["ui", "embedded", "eink", "simulator", "xpui"]
categories = ["development-tools", "gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "xpui_simulator"
crate-type = ["rlib"]

[dependencies]
xpui.workspace = true
xpui-boards.workspace = true
# The chrome it wires into a backend. The simulator stands in for a firmware,
# and a firmware is what chooses measurements and words for its panel.
xpui-chrome.workspace = true
# The backend it installs. No screenshot feature any more: the BMP writer it
# uses for the screenshot key lives in `xpui-screenshot`, which does not drag
# a PNG codec in behind it.
xpui-embedded-graphics.workspace = true
# `Framebuffer::new` and `write_bmp_in`, for the screenshot key. Without
# `golden`: `write_bmp_in` hand-writes a BITMAPINFOHEADER and needs no image
# codec. This crate compiles one anyway, because `embedded-graphics-simulator`
# pulls `image` which pulls `png` — so the saving is not here, it is for
# everyone else.
xpui-screenshot.workspace = true
embedded-graphics = "0.8"
embedded-graphics-simulator = "0.8"

[dev-dependencies]
# The guide shows how to screenshot a screen without a window, and that block
# is compiled rather than taken on trust.
xpui = { workspace = true, features = ["testing"] }
