[package]
name = "xpui-simulator"
description = "Runs an xpui app in a desktop window, for developing screens without hardware"
readme = "README.md"
keywords = ["ui", "embedded", "eink", "simulator", "xpui"]
categories = ["development-tools", "gui"]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-simulator"

[lints]
workspace = true

[lib]
name = "xpui_simulator"
crate-type = ["rlib"]

[dependencies]
xpui = { git = "https://github.com/XPUI-Framework/xpui-framework", branch = "main" }
# The vocabulary a device is described in — `Board`, `Bezel`, `KeyAction`. Not
# a vendor's data: this crate names no device, and the cycle it walks is the
# one its caller hands it.
xpui-boards-core = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
# The chrome it wires into a backend. The simulator stands in for a firmware,
# and a firmware is what chooses measurements and words for its panel.
xpui-chrome = { git = "https://github.com/XPUI-Framework/xpui-chrome", branch = "main" }
# The backend it installs.
xpui-embedded-graphics = { git = "https://github.com/XPUI-Framework/xpui-backends", branch = "main" }
# `Framebuffer::new` and `write_bmp_in`, for the screenshot key, and nothing
# more: without `golden`, so an application built on this crate is not handed
# golden-image comparison it did not ask for.
xpui-screenshot = { git = "https://github.com/XPUI-Framework/xpui-backends", branch = "main", default-features = false }
embedded-graphics = "0.8"
embedded-graphics-simulator = "0.8"

[dev-dependencies]
# Real devices, for tests only. A test needs bodies with keys on them to be
# worth anything, and a dev-dependency does not reach a consumer.
xpui-boards-pimoroni = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
xpui-boards-seeed = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
xpui-boards-xteink = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
# The guide shows how to screenshot a screen without a window, and that block
# is compiled rather than taken on trust. It asserts against a golden, which
# is the feature the dependency above leaves off.
xpui = { git = "https://github.com/XPUI-Framework/xpui-framework", branch = "main", features = ["testing"] }
xpui-screenshot = { git = "https://github.com/XPUI-Framework/xpui-backends", branch = "main" }

[workspace]
# `xtask` is the gate. A member rather than a separate workspace so one
# `cargo test` reaches its tests.
members = ["xtask"]

# Three lints the compiler does not deny on its own, denied in every workspace
# root so that the table is one passage. `too_long_first_doc_paragraph` is the
# one to watch: it is a nursery lint, off by default, so clippy may rename or
# retire it — and a name clippy no longer knows is an `unknown_lints` warning,
# which `-D warnings` turns into a red gate in every repository at once.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
too_long_first_doc_paragraph = "deny"

[workspace.lints.rustdoc]
unescaped_backticks = "deny"

# What a `cargo build --release` of this repository alone produces — not what
# ships. A library's profile applies only at the top of a build; a firmware's
# workspace sets the profile for everything it links; `xpui-rp2040`,
# `xpui-esp32` and `xpui-cpp` use `opt-level = "z"`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
