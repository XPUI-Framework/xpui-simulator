# This repository's gate, as a program rather than a thousand lines of
# shell.  It holds only what this repository checks. It runs on a desktop
# and nowhere else, so there are no bare-metal lints and no C++ stage.
#
# No dependencies, on purpose: a gate that fails because something it
# fetched moved is a gate that has to be argued with before it can be
# believed.
[package]
name = "xtask"
description = "The gate for xpui-simulator: format, lint, test, and the prose"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-simulator"
publish = false

[lints]
workspace = true

[dependencies]
